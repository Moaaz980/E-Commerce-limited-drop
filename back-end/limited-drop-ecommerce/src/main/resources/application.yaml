spring:
  # connessione al database
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # jpa e hibernate
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

# Context path

server:
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    objectmethod:
      it:
        limited_drop_ecommerce: DEBUG
